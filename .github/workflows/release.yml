name: Release distributions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Require release tag to match the shared version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG !== 'v'+p.version) throw Error('Release tag must match package.json');"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run test:packages
      - run: git diff --exit-code -- vmware-workstation packaging
      - name: Attach validated packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload $env:RELEASE_TAG "dist/vmware-workstation-$version.zip" "dist/vmware-workstation-$version.mcpb" "dist/vmware-workstation-$version-SHA256SUMS.txt"
