name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} tests and plugin package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests without VMware
        run: npm test
      - name: Build, validate, and package the plugin
        run: npm run package
      - name: Test extracted distributions without development dependencies
        run: npm run test:packages
      - name: Check generated files are current
        run: git diff --exit-code -- vmware-workstation packaging
      - name: Upload plugin distributions and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmware-workstation-plugin-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.mcpb
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
